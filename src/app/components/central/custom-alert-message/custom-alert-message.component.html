<div *ngIf="showAlert" #banner id="general-alerting-banner">
  <span
    class="banner-message"
    style="color: whitesmoke"
    [innerHTML]="alertMessage"
  ></span>

  <div class="banner-actions">
    <button mat-raised-button class="banner-btn" (click)="dismiss()">
      Dismiss
    </button>
  </div>
</div>
