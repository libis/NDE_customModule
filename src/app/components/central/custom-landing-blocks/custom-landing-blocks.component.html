<div
  *ngIf="blocks.length > 0"
  id="custom-landing-blocks"
  class="landing-blocks"
  [ngClass]="columnClass"
>
  <div
    *ngFor="let block of blocks; trackBy: trackById"
    class="landing-block"
    [class.full-row]="block.descriptionType === 'image-url'"
  >
    <h2
      *ngIf="block.title"
      class="landing-block-title mat-headline-large"
      [innerHTML]="block.title"
    ></h2>

    <ng-container [ngSwitch]="block.descriptionType">
      <div
        *ngSwitchCase="'image-html'"
        class="landing-block-html"
        [innerHTML]="block.description"
      ></div>

      <img
        *ngSwitchCase="'image-url'"
        class="landing-block-image"
        [src]="block.description"
        alt=""
      />

      <p
        *ngSwitchCase="'text'"
        class="landing-block-description"
        [innerHTML]="block.description"
      ></p>
    </ng-container>
  </div>
</div>
