<div *ngIf="blocks.length > 0" class="landing-blocks" [ngClass]="columnClass">
  <div *ngFor="let block of blocks; trackBy: trackById" class="landing-block">
    <h2
      *ngIf="block.title"
      class="landing-block-title mat-headline-large"
      [innerHTML]="block.title"
    ></h2>

    <ng-container [ngSwitch]="block.descriptionType">
      <div *ngSwitchCase="'image-html'" [innerHTML]="block.description"></div>

      <img
        *ngSwitchCase="'image-url'"
        class="landing-block-image"
        [src]="block.description"
        alt=""
      />

      <p *ngSwitchCase="'text'" [innerHTML]="block.description"></p>
    </ng-container>
  </div>
</div>
