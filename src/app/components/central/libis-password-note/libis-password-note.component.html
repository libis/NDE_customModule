<div class="view-it-info-box">
    @if(hasCredentials()){
    @if(credentials !== ''){
    <span class="mat-body-medium">{{ credentials }}</span>
    }@else{
    @if(isLoading){
    <span class="load_message mat-body-medium">Collecting credentials...</span>
    }
    @else{
    <button mat-button class="mdc-button" (click)="collectCredentials()">Get credentials</button>
    }
    }
    }
</div>
