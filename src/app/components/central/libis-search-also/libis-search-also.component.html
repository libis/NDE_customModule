<!---<p>libis-search-also works!</p>-->
@if (searchAlsoLinks().length > 0) {
    <div class="search-also-container">

    <button mat-button type="button" [matMenuTriggerFor]="searchAlsoList" id="search_also_button" class="btn btn-text btn-rounded outside-button margin-right-medium white-space-nowrap mdc-button mat-mdc-button mat-primary mat-mdc-button-base search-also">
        <!--<mat-icon>travel_explore</mat-icon>-->
        <span class="mdc-button__label">{{ 'nde.custom.search_also.title' | translate }}</span>
        <mat-icon class="mat-icon notranslate shrink-0 nde-mat-icon-size-medium primary-fill mat-icon-no-color" iconPositionEnd>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #searchAlsoList class="mat-mdc-menu-panel" [overlapTrigger]="false" panelClass="search-also-menu">
        @for(link of searchAlsoLinks(); track link.name) {
        <a mat-menu-item class="mat-mdc-menu-item mat-focus-indicator search_also_link" matTooltip="{{ link.tooltip | translate}}"
        [href]="link.URL" target="_blank">
            <img class="resource_icon"
            [src]="link.icon"
            />
            <span class="mat-mdc-menu-item-text"> {{link.name}}</span>
        </a>
    }
    </mat-menu>
    </div>
}
